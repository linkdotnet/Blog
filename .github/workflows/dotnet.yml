name: dotnet

on:
  push:
    branches: [ master ]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    branches: [ master ]
    paths-ignore:
      - "**/*.md"
      - "docs/**"

concurrency:
  group: dotnet-${{ github.ref }}-1
  cancel-in-progress: true

jobs:
  build:

    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            test-filter: ''
          # SQL Server images are only published for x64
          - os: ubuntu-24.04-arm
            test-filter: '--filter-not-trait "Requires=x64"'
          # macOS runners have no Docker for the Testcontainers-based tests
          - os: macos-latest
            test-filter: '--filter-not-trait "Requires=Docker"'

    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: |
          10.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore -c Release
    - name: Test
      run: dotnet test -c Release --no-build ${{ matrix.test-filter }}
